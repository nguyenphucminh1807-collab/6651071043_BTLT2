<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Tạo form và các điều khiển trên form</title>
<style>
body { font-family: Arial; }
.login { width:420px; margin:40px auto; }
h2 { text-align:center; color:#994400; }
table { width:100%; background:#DFF5FF; border:1px solid #900; }
td { border:1px solid #999; padding:5px; }
#ketqua { text-align:center; color:blue; font-weight:bold; }
</style>
</head>
<body>
<form id="formDangNhap">
<div class="login">
<h2>Đăng nhập</h2>
<table>
<tr><td>Mã người dùng:</td><td><input type="text" id="maNguoiDung"></td></tr>
<tr><td>Mật khẩu:</td><td><input type="password" id="matKhau"></td></tr>
<tr><td colspan="2" align="center">
<input type="button" value="Đồng ý" onclick="dangNhap()">
</td></tr>
<tr><td colspan="2"><div id="ketqua"></div></td></tr>
</table>
</div>
</form>
<script>
function dangNhap() {
    document.getElementById("ketqua").innerText =
        document.getElementById("maNguoiDung").value;
}
</script>
</body>
</html>
